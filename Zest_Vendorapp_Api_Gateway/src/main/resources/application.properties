spring.application.name=Zest_Vendorapp_Api_Gateway 

server.port=8080

#eureka.client.service-url.defaultZone=http://localhost:8761
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
spring.config.import=optional:configserver:http://localhost:8888 



#Gateways Routes  
spring.cloud.gateway.routes[0].id=onboarding-service
spring.cloud.gateway.routes[0].uri=lb://ZEST_VENDORAPP_ONBOARDING_SERVICE
#spring.cloud.gateway.routes[0].predicates[0]=Path=/onboarding/**
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/vendor/auth/**